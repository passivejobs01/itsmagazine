# Home Assistant 자동화 — 문이 열리면 웹캠 사진을 텔레그램으로
#
#   설정 ▸ 자동화 및 장면 ▸ 자동화 만들기 ▸ (우상단 ⋮) YAML 로 편집
#   < > 안의 값은 본인 환경에 맞게 바꾼다.

alias: 사무실 문 열림 — 웹캠 사진 알림
description: 문 센서가 열림으로 바뀌면 go2rtc 스냅샷을 텔레그램으로 보낸다

triggers:
  - trigger: state
    entity_id: binary_sensor.<문_센서_엔티티>
    from: "off"
    to: "on"

conditions: []

actions:
  # telegram_bot.send_photo 는 url 을 직접 받는다.
  # 파일로 저장했다가 보낼 필요가 없어 Generic Camera 등록 없이도 동작한다.
  - action: telegram_bot.send_photo
    data:
      entity_id: notify.<텔레그램_봇_엔티티>
      url: http://<PC의_LAN_IP>:1984/api/frame.jpeg?src=webcam
      caption: "🚪 문이 열렸습니다 {{ now().strftime('%H:%M:%S') }}"

  # 알림 폭주 방지 — mode: single 과 짝이다.
  # 1분 안에 문이 다시 열려도 건너뛴다.
  - delay:
      minutes: 1

mode: single

# ⚠️ HA 2026.9 부터 target: 이 entity_id: 로 바뀌었다. 옛 예제를 그대로 쓰면 실패한다.
